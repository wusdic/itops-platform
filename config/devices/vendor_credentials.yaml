# =============================================================================
# 设备厂商指纹与默认账密数据库
# =============================================================================
# 用途：免认证指纹识别 + 自动探测默认账密
# 格式：每条厂商记录包含设备类型、指纹模式、默认账密、建议协议
# 来源：基于 cvedb.org、RouterPasswords、厂商文档整理
# =============================================================================

# 设备分类枚举
# server: 物理服务器
# switch: 交换机（二层/三层）
# router: 路由器
# firewall: 防火墙
# wireless: 无线AP/控制器
# ups: UPS电源
# storage: 存储/NAS
# camera: IP摄像头/NVR
# printer: 网络打印机
# loadbalancer: 负载均衡器
# ids_ips: 入侵检测/防御
# virtualization: 虚拟化平台
# cloud: 云主机/云平台
# iot: 物联网/工控设备
# other: 其他

# -----------------------------------------------------------------------------
# 网络设备 - 路由器/交换机
# -----------------------------------------------------------------------------

vendors:

  # Cisco Systems - 全球最大网络设备厂商
  - name: Cisco Systems
    short_name: Cisco
    category: switch
    homepage: https://www.cisco.com
    description: 全球领先的网络设备厂商，产品涵盖交换机/路由器/防火墙/无线等
    fingerprints:
      - pattern: "(?i)(cisco|ios-xe|ios-xr|nx-os|nexus|cisco internetwork operating system)"
        type: ssh_banner
        weight: 0.9
      - pattern: "(?i)(cisco| catalyst| nexus)"
        type: http_header
        weight: 0.7
      - oid_prefix: "1.3.6.1.4.1.9"
        type: snmp_sysObjectID
        weight: 0.95
    default_credentials:
      - protocol: ssh
        username: cisco
        password: ""
        password_hash: ""
        notes: 老款 Catalyst 交换机默认
        priority: 1
      - protocol: ssh
        username: admin
        password: ""
        notes: 新款设备默认
        priority: 2
      - protocol: ssh
        username: admin
        password: ""
        notes: 企业级设备
        priority: 3
      - protocol: http
        username: admin
        password: ""
        notes: Web 管理界面
        priority: 4
    suggested_protocols:
      - ssh
      - snmp_v2c
      - http
    probe_ports: [22, 161, 80, 443]

