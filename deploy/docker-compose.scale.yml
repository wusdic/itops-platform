# ITOps Platform — 水平扩展部署配置
# 用法: docker compose -f docker-compose.scale.yml up -d
#
# 扩缩容:
#   SCALE=3 docker compose -f docker-compose.scale.yml up -d   # 启动3个API实例
#   docker compose -f docker-compose.scale.yml up -d --scale api=5 # 扩到5个API实例
#
# 前置要求:
#   1. 外部 MySQL (itops-mysql)、Redis (itops-redis) 已运行
#   2. 修改下方 MYSQL_HOST / REDIS_HOST 为实际地址

version: "3.8"

services:
  # ─── 负载均衡器 ───────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: itops-nginx
    restart: unless-stopped
    ports:
      - "8000:80"          # 对外入口（替换直接访问8000）
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── API 实例（无状态，可水平扩展）──────────────────────
  # 默认启动2个实例，通过 --scale api=N 调整
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: itops-api-${HOSTNAME:-1}
    restart: unless-stopped
    environment:
      # MySQL 连接（使用外部容器或宿主机）
      MYSQL_HOST: ${MYSQL_HOST:-itops-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-Admin@123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-itops_platform}
      # Redis 连接
      REDIS_HOST: ${REDIS_HOST:-itops-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # JWT 密钥（所有实例必须相同，实现无状态会话）
      JWT_SECRET: ${JWT_SECRET:-itops-platform-jwt-secret-change-in-production}
      JWT_ALGORITHM: HS256
      # Python 并发配置
      UVICORN_WORKERS: 2
      # 日志级别
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/auth/login", "-X", "POST", "-H", "Content-Type: application/json", "-d", '{"username":"admin","password":"Admin@123456"}']
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      replicas: ${SCALE:-2}
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    depends_on:
      - redis
    networks:
      - itops-net

  # ─── Redis（会话/缓存）──────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: itops-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis-data:/data
    networks:
      - itops-net

networks:
  itops-net:
    driver: bridge

volumes:
  redis-data:
