name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Python (API) ───────────────────────────────────────────
  ruff:
    name: Ruff Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install ruff
      - run: ruff check api/ modules/ app/

  pytest-api:
    name: Pytest (API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: api/requirements.txt
      - run: pip install -r api/requirements.txt
      - run: pip install pytest pytest-asyncio httpx
      - run: cd api && python -c "from main import app; print('Import OK')"
      - run: cd api && pytest tests/ -v --tb=short || true

  # ── Frontend (JS/TS/Vue) ─────────────────────────────────
  node-modules:
    name: Frontend Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci --legacy-peer-deps

  lint-frontend:
    name: Frontend Lint
    runs-on: ubuntu-latest
    needs: node-modules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci --legacy-peer-deps
      - run: cd frontend && npm run lint || true

  build-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: node-modules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci --legacy-peer-deps
      - run: cd frontend && npm run build
      - run: cd frontend && du -sh dist/

  # ── Docs Check ─────────────────────────────────────────────
  docs-check:
    name: Docs Structure Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "=== Required docs directories ==="
          for dir in 00-overview 01-architecture 02-domains 03-api 04-frontend 05-implementation 06-operations 99-archive; do
            if [ -d "docs/$dir" ]; then
              echo "✓ docs/$dir exists"
            else
              echo "✗ docs/$dir MISSING"
              exit 1
            fi
          done
          echo "=== Facts source documents ==="
          grep -l "是否为事实源：yes" docs/01-architecture/*.md docs/05-implementation/*.md || { echo "No facts source found"; exit 1; }
          echo "=== Archived documents marked ==="
          grep -r "文档状态：archived" docs/99-archive/ || { echo "No archived markers found"; exit 1; }

  # ── Security ───────────────────────────────────────────────
  secrets-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch full history for detect-secrets to work well
          fetch-depth: 0
      - uses: Yelp/detect-secrets@v1.5.0
        with:
          exclude:
            files: '(frontend/node_modules|.git|dist/|*.pyc|docs/99-archive/)'

  # ── Dependency Vulnerability ────────────────────────────────
  safety-scan:
    name: Safety (Python deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install safety
      - run: pip install -r api/requirements.txt || true
      - run: safety check --stdin || true
