name: Build and Release

on:
  push:
    branches: [main]
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache npm dependencies
        uses: actions/cache@v3
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('api/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install --legacy-peer-deps

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Install Python dependencies
        run: |
          cd api
          pip install -r requirements.txt

      - name: Run backend tests
        run: |
          cd api
          pip install pytest pytest-asyncio
          pytest tests/ -v || true

      - name: Create release package
        run: |
          mkdir -p dist
          # 复制必要的目录和文件
          cp -r api/ dist/
          cp -r frontend/dist/ dist/
          cp -r nginx/ dist/
          cp -r scripts/ dist/
          cp -r modules/ dist/
          cp -r config/ dist/
          cp -r docs/ dist/
          cp .env.example dist/
          cp .gitignore dist/
          cp README.md dist/
          cp PHYSICAL_DEPLOY.md dist/
          # 创建版本信息
          echo "${{ github.sha }}" > dist/VERSION
          echo "${{ github.event_name == 'release' && github.event.release.tag_name || 'latest' }}" > dist/TAG
          # 打包
          tar -czf itops_platform.tar.gz -C dist .
          ls -lh itops_platform.tar.gz

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: itops_platform.tar.gz
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: itops-platform-package
          path: itops_platform.tar.gz
          retention-days: 30
